appId: com.example.tiktokdesktop.normal
productName: TikTok Desktop
directories:
  output: dist/normal
files:
  - src/**/*
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
extraMetadata:
  proxyMode: false
